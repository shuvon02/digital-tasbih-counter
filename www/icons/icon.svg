<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#0d2b24"/>
      <stop offset="100%" stop-color="#051310"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded app squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(52, 211, 153, 0.25)" stroke-width="4"/>

  <!-- Glowing Circular Track -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(16, 185, 129, 0.15)" stroke-width="26"/>

  <!-- Active Arc -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#ringGrad)" stroke-width="26" stroke-linecap="round" stroke-dasharray="750 1000" transform="rotate(-90 256 256)" filter="url(#glow)"/>

  <!-- Central Digital Beads Motif -->
  <!-- Tasbih Beads Ring -->
  <circle cx="256" cy="136" r="14" fill="url(#goldGrad)" />
  <circle cx="341" cy="171" r="12" fill="url(#ringGrad)" />
  <circle cx="376" cy="256" r="12" fill="url(#ringGrad)" />
  <circle cx="341" cy="341" r="12" fill="url(#ringGrad)" />
  <circle cx="256" cy="376" r="14" fill="url(#goldGrad)" />
  <circle cx="171" cy="341" r="12" fill="url(#ringGrad)" />
  <circle cx="136" cy="256" r="12" fill="url(#ringGrad)" />
  <circle cx="171" cy="171" r="12" fill="url(#ringGrad)" />

  <!-- Center Counter Icon (Tally/Counter Symbol) -->
  <circle cx="256" cy="256" r="54" fill="rgba(16, 185, 129, 0.1)" stroke="url(#ringGrad)" stroke-width="5"/>
  <path d="M236 256 L276 256 M256 236 L256 276" stroke="#f0fdf4" stroke-width="8" stroke-linecap="round"/>
</svg>
